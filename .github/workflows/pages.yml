name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        env:
          # Chromium is installed later, and only for the visual smoke.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # Tests run first; a failing test stops the deploy.
      # The visual smoke is separate. It does not use the files issue 11 is missing.
      - run: npm test
      - run: npm run build:pages
      - run: npx playwright install --with-deps chrome
      - run: npm run test:visual
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
